- name: Развертывание WordPress с Docker + Prometheus
  hosts: all
  become: true
  vars:
    # mysql_root_password: "my_root_password"
    prometheus_volume: "prometheus_data"
    prometheus_config_dir: "/opt/prometheus"
    docker_network: "wp_network"
    grafana_admin_password: "admin123"


  tasks:
  
    - name: Создаю volume для Prometheus
      community.docker.docker_volume:
        name: "{{ prometheus_volume }}"
        state: present

    - name: Создаю volume для graf
      community.docker.docker_volume:
        name: "grafana_data"
        state: present

    - name: Создаю директорию для конфига Prometheus
      ansible.builtin.file:
        path: "{{ prometheus_config_dir }}"
        state: directory
        mode: '0755'
    - name: Создаю директорию для источников данных
      ansible.builtin.file:
        path: /etc/grafana/provisioning/datasources
        state: directory
        mode: '0755'

    - name: Копирую конфиг Prometheus для Grafana
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/provisioning/datasources/prometheus.yml"
        dest: "/etc/grafana/provisioning/datasources/prometheus.yml"
        mode: '0644'

    - name: Копирую конфиг Prometheus
      ansible.builtin.template:
        src: "{{ playbook_dir }}/templates/prometheus.yml.j2"
        dest: "{{ prometheus_config_dir }}/prometheus.yml"
        mode: '0644'
      notify: Перезапуск Prometheus

    - name: Запускаю Prometheus
      community.docker.docker_container:
        name: prometheus
        image: prom/prometheus:latest
        state: started
        restart_policy: unless-stopped
        networks:
          - name: "{{ docker_network }}"
        published_ports:
          - "9090:9090"
        volumes:
          - "{{ prometheus_volume }}:/prometheus"
          - "{{ prometheus_config_dir }}/prometheus.yml:/etc/prometheus/prometheus.yml"

# Для сбора системных метрик
    - name: Запускаю Node Exporter
      community.docker.docker_container:
        name: node_exporter
        image: prom/node-exporter:latest
        state: started
        restart_policy: unless-stopped
        networks:
          - name: "{{ docker_network }}"
        published_ports:
          - "9100:9100"
        command: --path.rootfs=/host
        volumes:
          - "/:/host:ro,rslave"


    - name: Запускаю cAdvisor
      community.docker.docker_container:
        name: cadvisor
        image: gcr.io/cadvisor/cadvisor:latest
        state: started
        restart_policy: unless-stopped
        networks:
          - name: "{{ docker_network }}"
        published_ports:
          - "8080:8080"
        volumes:
          - "/:/rootfs:ro"
          - "/var/run:/var/run:rw"
          - "/sys:/sys:ro"
          - "/var/lib/docker/:/var/lib/docker:ro"

    - name: Проверка работы Prometheus
      ansible.builtin.wait_for:
        host: localhost
        port: 9090
        delay: 10
        timeout: 60
        state: started

    - name: Запускаю Grafana
      community.docker.docker_container:
        name: grafana
        image: grafana/grafana:latest
        state: started
        restart_policy: unless-stopped
        env:
          GF_SECURITY_ADMIN_USER: "admin"
          GF_SECURITY_ADMIN_PASSWORD: "{{ grafana_admin_password }}"
          GF_USERS_ALLOW_SIGN_UP: "false"
        networks:
          - name: "{{ docker_network }}"
        published_ports:
          - "3000:3000"
        volumes:
          - "grafana_data:/var/lib/grafana"
          # - "/etc/grafana/provisioning/datasources/:/etc/grafana/provisioning/datasources/"
          # - "/etc/grafana/provisioning/dashboards/:/etc/grafana/provisioning/dashboards/"

    - name: Проверка работы Grafana
      ansible.builtin.wait_for:
        host: localhost
        port: 3000
        delay: 10
        timeout: 60
        state: started

    - name: Create directories
      ansible.builtin.file:
        path: "{{ playbook_dir }}/provisioning/dashboards"
        state: directory
        mode: '0755'

    - name: Скачивание Дашборда
      ansible.builtin.get_url:
        url: https://grafana.com/api/dashboards/14282/revisions/latest/download
        dest: "{{ playbook_dir }}/provisioning/dashboards/cadvisor.json"
        mode: '0644'

    - name: Read dashboard JSON
      ansible.builtin.slurp:
        src: "{{ playbook_dir }}/provisioning/dashboards/cadvisor.json"
      register: raw_dashboard


    - name: Импорт дашборда cAdvisor
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:3000/api/dashboards/import"
        method: POST
        headers:
          Content-Type: "application/json"
          Authorization: "Basic {{ ('admin' + ':' + 'admin123') | b64encode }}"
        body:
          dashboard: "{{ raw_dashboard.content | b64decode | from_json }}"
          inputs:  # Добавляем явную привязку переменной
            - name: "DS_PROMETHEUS"
              type: "datasource"
              pluginId: "prometheus"
              value: "Prometheus"  # Имя источника данных
          overwrite: true
        body_format: json
        status_code: 200

    - name: Скачивание Дашборда node
      ansible.builtin.get_url:
        url: https://grafana.com/api/dashboards/1860/revisions/22/download
        dest: "{{ playbook_dir }}/provisioning/dashboards/Nodeex.json"
        mode: '0644'

    - name: Read dashboard JSON
      ansible.builtin.slurp:
        src: "{{ playbook_dir }}/provisioning/dashboards/Nodeex.json"
      register: raw_dashboard


    - name: Импорт дашборда Nodeex
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:3000/api/dashboards/import"
        method: POST
        headers:
          Content-Type: "application/json"
          Authorization: "Basic {{ ('admin' + ':' + 'admin123') | b64encode }}"
        body:
          dashboard: "{{ raw_dashboard.content | b64decode | from_json }}"
          inputs:  # Добавляем явную привязку переменной
            - name: "DS_PROMETHEUS"
              type: "datasource"
              pluginId: "prometheus"
              value: "Prometheus"  # Имя источника данных
          overwrite: true
        body_format: json
        status_code: 200

    - name: Set monitoring URL
      ansible.builtin.set_fact:
        monitoring_url: "http://{{ ansible_host }}:3000"

    - name: Вывожу информацию об адресе grafana
      ansible.builtin.debug:
        msg:
          - "monitoring_url: {{ monitoring_url }}"

  handlers:
    - name: Перезапуск Prometheus
      community.docker.docker_container:
        name: prometheus
        image: prom/prometheus:latest
        state: started
        restart_policy: unless-stopped
        networks:
          - name: "{{ docker_network }}"
        published_ports:
          - "9090:9090"
        volumes:
          - "{{ prometheus_volume }}:/prometheus"
          - "{{ prometheus_config_dir }}/prometheus.yml:/etc/prometheus/prometheus.yml"
      listen: "Перезапуск Prometheus"
